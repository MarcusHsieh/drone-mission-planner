<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone Mission Planner</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="title">Drone Mission Planner</div>
        <div class="subtitle" id="course-name">Loading course…</div>
        <div id="topbar-status"></div>
        <div class="topbar-actions">
          <div id="panels-menu-wrap">
            <button id="btn-panels" class="ghost small" aria-haspopup="true" aria-expanded="false">Panels ▾</button>
            <div id="panels-menu" hidden></div>
          </div>
          <button id="btn-reset-layout" class="ghost small" title="Put every panel back where it starts">Reset layout</button>
        </div>
      </header>
      <div id="dock"></div>
    </div>

    <!-- Panel contents. Each child is moved into a dashboard panel at startup
         and back here while its panel is closed, so its state and listeners survive. -->
    <div id="panel-store" hidden>
      <div data-panel="map" class="panel-body map-panel">
        <div id="map"></div>
        <div id="map-help">
          <b>Click</b> select / deselect a cell · <b>Shift+drag</b> add a box · <b>Alt+drag</b> remove a box · <b>Right-click</b> cell info and what3words
        </div>
        <div class="map-toggles">
          <div id="basemap-toggle">
            <button data-basemap="satellite" class="active">Satellite</button><button data-basemap="map">Map</button>
          </div>
          <div id="view-toggle" title="2D: top-down map. 3D: tilted view with the drone at its real altitude (right-drag or Ctrl+drag to tilt and turn). Chase: the camera follows the drone.">
            <button data-view="2d" class="active">2D</button><button data-view="3d">3D</button><button data-view="chase">Chase</button>
          </div>
        </div>
        <div id="legend-3d" hidden></div>
        <div id="google-attribution" hidden><b class="google-logo">Google</b> <span></span></div>
      </div>

      <div data-panel="agent" class="panel-body pad" id="chat-section">
        <div class="panel-sub">Model <span class="chip" id="model-chip"></span></div>
        <div id="chat-log"></div>
        <div id="suggestions"></div>
        <form id="chat-form">
          <input id="chat-input" autocomplete="off" placeholder="Ask the agent, e.g. survey the fairway on hole 4" />
          <button type="submit" id="chat-send">Send</button>
        </form>
      </div>

      <div data-panel="selection" class="panel-body pad">
        <div class="panel-sub muted" id="totals"></div>
        <div id="groups"></div>
        <div class="row">
          <button id="btn-preview">Preview path</button>
          <button id="btn-clear" class="ghost">Clear selection</button>
        </div>
        <div id="route" class="muted small"></div>
      </div>

      <div data-panel="flight" class="panel-body pad">
        <div class="panel-sub"><span class="chip warn" id="drone-chip">Simulated</span></div>
        <div id="drone"></div>
        <div class="row">
          <button id="btn-fly">Fly</button>
          <button id="btn-abort" class="danger">Abort (return to dock)</button>
        </div>
      </div>

      <div data-panel="tasks" class="panel-body pad" id="tasks-panel">
        <div class="panel-sub">Scan for divots</div>
        <div class="row tasks-gen">
          <button id="btn-place" class="small ghost" title="Click the map to place hidden divots; click one again to remove it">Place on map</button>
          <button id="btn-scatter" class="small ghost" title="Scatter 10 hidden divots on the fairways">Scatter 10</button>
          <button id="btn-placed-clear" class="small ghost">Clear placed</button>
          <button id="btn-scan" class="small" title="Fly the previewed path with the camera on">Scan route</button>
        </div>
        <div id="field-status" class="muted small"></div>
        <div class="panel-sub" style="margin-top:12px">Or skip the scan</div>
        <div class="row tasks-gen">
          <label>Divots <input id="divot-count" type="number" min="1" max="200" value="20" /></label>
          <label title="Comma-separated hole numbers, or empty for every hole">Holes <input id="divot-holes" placeholder="all" /></label>
          <button id="btn-divots" class="small ghost" title="Add known divot tasks directly, without a scan">Generate tasks</button>
        </div>
        <div class="row">
          <button id="btn-queue-run">Run queue</button>
          <button id="btn-queue-abort" class="danger">Abort</button>
          <button id="btn-queue-clear" class="ghost">Clear</button>
        </div>
        <div id="queue-status"></div>
        <div id="queue-legs"></div>
        <div id="queue-tasks"></div>
        <div id="queue-model" class="note"></div>
      </div>

      <div data-panel="hud" class="panel-body hud-panel"><canvas id="hud"></canvas></div>
      <div data-panel="battery" class="panel-body pad" id="battery-panel"></div>
      <div data-panel="gps" class="panel-body pad" id="gps-panel"></div>
      <div data-panel="health" class="panel-body pad" id="health-panel"></div>
      <div data-panel="messages" class="panel-body messages-panel">
        <div class="messages-tools">
          <label><input type="checkbox" id="msg-only-warn" /> Warnings and worse</label>
          <button id="btn-msg-clear" class="ghost small" title="Hide the messages so far (the backend keeps them)">Clear</button>
        </div>
        <div id="messages-log"></div>
      </div>
      <div data-panel="link" class="panel-body pad" id="link-panel"></div>
      <div data-panel="rangefinder" class="panel-body pad" id="rangefinder-panel"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
