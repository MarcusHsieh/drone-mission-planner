[project]
name = "drone-backend"
version = "0.1.0"
description = "Drone mission planner demo backend"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.4",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
